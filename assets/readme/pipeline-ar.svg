  <text x="836" y="252" text-anchor="start" direction="rtl" font-family="'Segoe UI', Tahoma, 'Geeza Pro', 'Noto Sans Arabic', sans-serif" font-size="20" fill="#b3a696">4 درجات Lighthouse</text>
  <text x="836" y="282" text-anchor="start" direction="rtl" font-family="'Segoe UI', Tahoma, 'Geeza Pro', 'Noto Sans Arabic', sans-serif" font-size="20" fill="#b3a696">درجة الصحّة هي</text>
