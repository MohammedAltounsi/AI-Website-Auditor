  <text x="1114" y="342" text-anchor="start" direction="rtl" font-family="'Segoe UI', Tahoma, 'Geeza Pro', 'Noto Sans Arabic', sans-serif" font-size="20" fill="#b3a696">مع حماية SSRF</text>
