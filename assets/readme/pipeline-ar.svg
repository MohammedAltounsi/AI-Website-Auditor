<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">كيف يجري التدقيق</title>
  <desc id="desc">أربع مراحل. مرحلتا الجلب والتقييم لا تستدعيان أي نموذج، ودرجة الصحّة متوسّط درجات PageSpeed الأربع بعد التقريب. مرحلة التحليل تستدعي Claude، فيعيد ملخّصاً وخمسة إصلاحات بصيغة JSON. مرحلة التقرير تعيد تقرير JSON واحداً مع تصدير PDF وCSV.</desc>
