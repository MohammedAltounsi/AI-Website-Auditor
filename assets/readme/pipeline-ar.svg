  <text x="558" y="312" text-anchor="start" direction="rtl" font-family="'Segoe UI', Tahoma, 'Geeza Pro', 'Noto Sans Arabic', sans-serif" font-size="20" fill="#b3a696">فيعيد JSON فيه:</text>
