  <line x1="86" y1="216" x2="280" y2="216" stroke="#f4efe4" stroke-opacity="0.14"/>
  <text x="280" y="252" text-anchor="start" direction="rtl" font-family="'Segoe UI', Tahoma, 'Geeza Pro', 'Noto Sans Arabic', sans-serif" font-size="20" fill="#b3a696">تقرير JSON واحد</text>
  <text x="280" y="282" text-anchor="start" direction="rtl" font-family="'Segoe UI', Tahoma, 'Geeza Pro', 'Noto Sans Arabic', sans-serif" font-size="20" fill="#b3a696">مؤشّرات وقائمة</text>
  <text x="280" y="312" text-anchor="start" direction="rtl" font-family="'Segoe UI', Tahoma, 'Geeza Pro', 'Noto Sans Arabic', sans-serif" font-size="20" fill="#b3a696">إصلاحات مرتّبة</text>
  <text x="280" y="342" text-anchor="start" direction="rtl" font-family="'Segoe UI', Tahoma, 'Geeza Pro', 'Noto Sans Arabic', sans-serif" font-size="20" fill="#b3a696">تصدير PDF وCSV</text>
  <text x="1136" y="410" text-anchor="start" direction="rtl" font-family="'Segoe UI', Tahoma, 'Geeza Pro', 'Noto Sans Arabic', sans-serif" font-size="21" fill="#96897a"><tspan fill="#ff7a1a">&lt;</tspan> درجة الصحّة = متوسّط الدرجات الأربع بعد التقريب</text>
